# 每日 08:00 / 20:00（北京时间）→ 大盘日报 + 板块日报 + 龙头板块财报跟进（各有新披露才发）
# cron 为 UTC：0 0,12 * * * = 北京 08:00 / 20:00
name: Market Monitor Daily Robot

on:
  schedule:
    - cron: '0 0,12 * * *'
  workflow_dispatch:

jobs:
  daily-reports:
    name: 大盘/板块/龙头财报 报告+邮件
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily reports and send emails
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: python scheduled_reports.py --task daily --sector-boards 20
