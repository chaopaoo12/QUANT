# 每天 18:00（北京时间）→ 板块分析报告 + 财报分析报告（各一封）+ 龙头板块财报跟进（有披露才发）
# cron 为 UTC：0 10 * * * = 北京 18:00
name: Market Monitor Sector & Financial

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

jobs:
  sector-financial:
    name: 板块/财报 报告+邮件
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run sector & financial reports and send emails
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: python scheduled_reports.py --task sector-financial --sector-boards 20 --fin-universe 30
